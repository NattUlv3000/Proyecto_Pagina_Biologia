<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Biología Interactiva</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>📝 Crear cuenta</h1>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="animales.html">Animales</a>
            <a href="investigaciones.html">Investigaciones</a>
            <a href="login.html">Login</a>
            <button id="botonTema" type="button">Modo oscuro</button>
        </nav>
    </header>

    <main>

        <section>

            <h2>Crear una cuenta</h2>

            <form id="formularioRegistro">

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">

                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password">

                <label for="password2">Repetir contraseña:</label>
                <input type="password" id="password2" name="password2">

                <button type="submit">Crear cuenta</button>

            </form>

            <p class="formulario-enlace">¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

        </section>

    </main>

    <footer>
        <p>Proyecto de Biología Interactiva</p>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
